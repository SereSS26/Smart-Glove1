; Folderul de compilare stă în afara sincronizării iCloud (sufixul .nosync), altfel compilarea se blochează.
[platformio]
workspace_dir = .pio.nosync

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; Unghiuri roll/pitch/yaw cu calibrare
[env:esp32dev]
build_src_filter = +<main.cpp>

; Scanner I2C pentru diagnostic
[env:scan]
build_src_filter = +<scan.cpp>

; Test senzor flex pe GPIO32
[env:flex]
build_src_filter = +<flex.cpp>

; Diagnostic legaturi senzor flex
[env:flexdiag]
build_src_filter = +<flexdiag.cpp>

; Test combinat: IMU + flex deget mare
[env:combo]
build_src_filter = +<combo.cpp>

; Test combinat: IMU + 5 senzori flex (GPIO 32-36)
[env:combo5]
build_src_filter = +<combo5.cpp>

; Test combinat: IMU + 2 senzori flex: DegetMare (GPIO32) si Aratator (GPIO33)
[env:combo2]
build_src_filter = +<combo2.cpp>

; Test giroscop + accelerometru (Gx/Gy/Gz, Roll/Pitch/Yaw)
[env:giro]
build_src_filter = +<giro.cpp>

; Firmware-ul mănușii: pachetul Live din contract pe USB (pentru tools/usb_bridge.py) și prin Bluetooth
[env:glove]
build_src_filter = +<glove.cpp>
lib_deps = h2zero/NimBLE-Arduino@^2.3.0
